DATA:
  dataset: "D10_ARKit52"
  demo_dataset: "D10_ARKit52"
  data_root: "/home/motion/omotion/trainFramework/data/unitalker_data/"
  duplicate_list: "1"
  train_json_key: train.json

LOSS:
  rec_weight: 1.0
  pca_weight: 0.0
  blendshape_weight: 0.0001

NETWORK:
  use_pca: False
  pca_dim: 512

MODEL:
  audio_encoder_repo: 'microsoft/wavlm-base-plus'
  freeze_wav2vec: False
  interpolate_pos: 1
  decoder_dimension: 256
  decoder_type: conv
  period: 30
  headlayer: 1

TRAIN:
  fix_encoder_first: False
  random_id_prob: 0.0
  re_init_decoder_and_head: False
  only_head: False
  workers: 0
  batch_size: 1
  batch_size_val: 1
  lr: 0.0001
  epochs: 100
  save_every: 1
  save_path: "/home/motion/omotion/trainFramework/models/unitalker/results_D10_ARKit52_vanilla"
  weight_path: null
  eval_every: 1
  test_every: 1
  log_every: 1
  do_test: True

TEST:
  test_wav_dir: "./test_audios"
  test_out_path: "./test_results/demo.npz"
